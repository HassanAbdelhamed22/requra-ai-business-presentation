<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#030014" />
  <meta name="description" content="Requra.AI — interactive business and product presentation: from fragmented stakeholder context to traceable, review-ready requirements." />
  <meta property="og:title" content="Requra.AI — From Context to Requirements You Can Trust" />
  <meta property="og:description" content="An interactive business and product presentation featuring Requra.AI, evidence-grounded requirements intelligence, market strategy and product proof." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://requra-ai-business-presentation.vercel.app" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://requra-ai-business-presentation.vercel.app" />
  <title>Requra.AI — From Context to Requirements You Can Trust</title>
  <link rel="stylesheet" href="styles/part-1.css" />
  <link rel="stylesheet" href="styles/part-2.css" />
  <link rel="stylesheet" href="styles/part-3.css" />
  <link rel="stylesheet" href="styles/part-4.css" />
  <link rel="stylesheet" href="styles/part-5.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

<header aria-label="Presentation controls" class="chrome">
<a aria-label="Requra.AI presentation home" class="brand" href="#s-01">
<span class="brand-mark-wrap"><img alt="" class="brand-mark" src="https://raw.githubusercontent.com/Requra/frontend/db60a53ed2b3621a3a8bae4ac28c4563d7919814/src/assets/images/Logo.png"/></span>
<span class="brand-word">Requra<span>.AI</span></span>
</a>
<div aria-live="polite" class="chrome-center">
<span id="sectionLabel">VISION</span>
<span class="chrome-dot"></span>
<span id="slideCounter">01 / 17</span>
</div>
<div class="chrome-actions">
<button aria-label="Toggle slide overview" class="icon-btn" id="overviewBtn" title="Overview (O)">⌘</button>
<button aria-label="Toggle fullscreen" class="icon-btn" id="fullscreenBtn" title="Fullscreen (F)">↗</button>
</div>
</header>
  <main id="deck" class="deck" aria-live="polite"></main>
  <nav aria-label="Slide navigation" class="nav-rail" id="navRail"></nav>
  <div aria-hidden="true" class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
  <button aria-label="Previous slide" class="nav-arrow prev" id="prevBtn">←</button>
  <button aria-label="Next slide" class="nav-arrow next" id="nextBtn">→</button>
  <div aria-hidden="true" class="overview" id="overview">
<div class="overview-head"><div><span>REQURA.AI</span><b>Presentation overview</b></div><button aria-label="Close overview" id="closeOverview">×</button></div>
<div class="overview-grid" id="overviewGrid"></div>
</div>
  <div class="key-hint" id="keyHint"><span>← →</span> navigate <i></i><span>O</span> overview <i></i><span>F</span> fullscreen</div>

  <script>
    (async () => {
      const deck = document.getElementById('deck');
      const parts = ['slides/part-1.html','slides/part-2.html','slides/part-3.html'];
      try {
        const html = await Promise.all(parts.map(async p => {
          const r = await fetch(p);
          if (!r.ok) throw new Error(`${p}: ${r.status}`);
          return r.text();
        }));
        deck.innerHTML = html.join('\n');
        const script = document.createElement('script');
        script.src = 'script.js';
        document.body.appendChild(script);
      } catch (error) {
        deck.innerHTML = `<section class="load-error"><h1>Unable to load presentation</h1><p>${error.message}</p></section>`;
      }
    })();
  </script>
</body>
</html>
